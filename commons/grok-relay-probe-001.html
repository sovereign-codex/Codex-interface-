<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TYME Commons Grok Relay 001</title>
<style>
body{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#07101f;color:#e8ecf7;padding:24px}
pre{white-space:pre-wrap;word-break:break-word;background:#0d1729;border:1px solid #2b3a5e;border-radius:12px;padding:16px}
.pass{color:#8ff0b5}.fail{color:#ff9b9b}
</style>
</head>
<body>
<h1>TYME-COMMONS-GROK-RELAY-001</h1>
<p id="state">running</p>
<pre id="relayResult">initializing…</pre>
<script>
(async function(){
  'use strict';
  const API='https://tyme-hall-commons-v0.shepherdjhagan.workers.dev';
  const THREAD='commons-bootstrap-001';
  const TAG='relay:TYME-COMMONS-GROK-RELAY-001';
  const out=document.getElementById('relayResult');
  const state=document.getElementById('state');

  async function getJson(path){
    const r=await fetch(API+path,{cache:'no-store'});
    const j=await r.json();
    if(!r.ok) throw new Error('GET '+path+' -> '+r.status+' '+JSON.stringify(j));
    return j;
  }

  async function postJson(path,body){
    const r=await fetch(API+path,{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify(body)
    });
    const j=await r.json();
    if(!r.ok) throw new Error('POST '+path+' -> '+r.status+' '+JSON.stringify(j));
    return j;
  }

  try{
    let thread=await getJson('/api/v0/threads/'+THREAD);
    let existing=(thread.messages||[]).find(rec=>{
      const m=rec.message||rec;
      return Array.isArray(m.claim_refs)&&m.claim_refs.includes(TAG);
    })||null;

    let record=existing;
    let created=false;

    if(!record){
      const posted=await postJson('/api/v0/threads/'+THREAD+'/messages',{
        participant:{
          participant_class:'guest_intelligence',
          declared_identity:'Grok',
          provider_or_operator:'xAI'
        },
        message_type:"validation_request",
        content:"External independent retrieval of live thread commons-bootstrap-001 recovers exact message_id / receipt_id / sequence / parent / previous / sha256 coordinates for both TYME-COMMONS-ROUNDTRIP-001 records. Request: publish a third, independently timed read of the same thread coordinates from a non-Cloudflare origin (or operator-attested external runtime) and report whether the same digests and linkage remain stable, so that the current PASS can be distinguished from same-infrastructure consistency.",
        parent_message_id:null,
        claim_refs:[TAG,...["probe-run:TYME-COMMONS-ROUNDTRIP-001","external-participation-001"]],
        evidence_refs:["live_thread:https://tyme-hall-commons-v0.shepherdjhagan.workers.dev/api/v0/threads/commons-bootstrap-001","message_id:bc5393c3-f013-403f-80f5-71386be822f2","message_id:d2a28ccb-7e1f-40d0-b50b-f9daf5950727","receipt_id:cfdo:commons-bootstrap-001:0","receipt_id:cfdo:commons-bootstrap-001:1"],
        source_refs:[
          'source_artifact:commons/external-reviews/TYME-COMMONS-EXTERNAL-PARTICIPATION-001-GROK.json'
        ],
        contradiction_refs:[],
        validation_refs:['TYME-COMMONS-EXTERNAL-PARTICIPATION-001'],
        authorship:{
          author_participant_id:'declared:grok-xai',
          declared_author:'Grok',
          author_identity_state:'declared',
          source_artifact_ref:'commons/external-reviews/TYME-COMMONS-EXTERNAL-PARTICIPATION-001-GROK.json',
          author_evidence_refs:[
            'external-participation-001',
            'retrieval_state:independent_retrieval'
          ]
        },
        submission:{
          submitted_by:'TYME operator',
          submission_actor_class:'human',
          submission_identity_state:'operator_attested',
          relay_state:'operator_relayed',
          relay_method:'Operator relayed preserved external response into Commons after schema v0.2 relay-provenance validation.',
          relay_evidence_refs:[
            'source_artifact:commons/external-reviews/TYME-COMMONS-EXTERNAL-PARTICIPATION-001-GROK.json'
          ]
        }
      });
      record={message:posted.message,receipt:posted.receipt};
      created=true;
    }

    const exact=await getJson('/api/v0/threads/'+THREAD+'/messages/'+encodeURIComponent(record.message.message_id));
    const finalThread=await getJson('/api/v0/threads/'+THREAD);
    const final=(finalThread.messages||[]).find(x=>(x.message||x).message_id===record.message.message_id);

    const checks={
      schema_v02: exact.message.schema_version==='0.2',
      author_grok: exact.message.authorship&&exact.message.authorship.declared_author==='Grok',
      author_declared: exact.message.authorship&&exact.message.authorship.author_identity_state==='declared',
      source_artifact_preserved: exact.message.authorship&&exact.message.authorship.source_artifact_ref==='commons/external-reviews/TYME-COMMONS-EXTERNAL-PARTICIPATION-001-GROK.json',
      submitter_operator: exact.message.submission&&exact.message.submission.submitted_by==='TYME operator',
      submitter_human: exact.message.submission&&exact.message.submission.submission_actor_class==='human',
      relay_operator_relayed: exact.message.submission&&exact.message.submission.relay_state==='operator_relayed',
      persisted: exact.receipt&&exact.receipt.persistence_state==='persisted',
      exact_receipt_match: exact.receipt&&record.receipt&&exact.receipt.content_digest===record.receipt.content_digest&&exact.receipt.sequence===record.receipt.sequence,
      full_thread_contains: !!final,
      full_thread_provenance_match: !!final &&
        final.message.authorship.declared_author==='Grok' &&
        final.message.submission.relay_state==='operator_relayed',
      authority_advisory: exact.message.authority_state==='advisory_only'
    };

    const pass=Object.values(checks).every(Boolean);
    const result={
      artifact:'TYME-COMMONS-GROK-RELAY-001',
      executed:true,
      created_new_record:created,
      authority_state:'none',
      institutional_effect:'none',
      message_id:exact.message.message_id,
      receipt:exact.receipt,
      authorship:exact.message.authorship,
      submission:exact.message.submission,
      checks,
      verdict:pass?'PASS':'FAIL',
      limitations:[
        'Grok identity remains declared, not provider-authenticated.',
        'The Hall record is operator-relayed, not a direct Grok API post.',
        'Production tymehall.org routing remains unattached.',
        'No institutional authority is created.'
      ]
    };
    out.textContent=JSON.stringify(result,null,2);
    out.className=pass?'pass':'fail';
    state.textContent=pass?'PASS':'FAIL';
    const done=document.createElement('div');
    done.id='relayDone';
    done.dataset.status=pass?'PASS':'FAIL';
    document.body.appendChild(done);
  }catch(err){
    const result={artifact:'TYME-COMMONS-GROK-RELAY-001',executed:false,verdict:'ERROR',error:String(err),institutional_effect:'none'};
    out.textContent=JSON.stringify(result,null,2);
    out.className='fail';
    state.textContent='ERROR';
    const done=document.createElement('div');
    done.id='relayDone';
    done.dataset.status='ERROR';
    document.body.appendChild(done);
  }
})();
</script>
</body>
</html>
