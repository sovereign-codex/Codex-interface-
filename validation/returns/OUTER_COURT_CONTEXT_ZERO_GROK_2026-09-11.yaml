strongest_ambiguity: "The first-screen verbs (especially KNOW and the abstract 'what is becoming') still require the participant to map them onto institutional nouns that are only fully explained after entry; residual vocabulary load remains for terms such as Scrolls, Canon, Constellation, and Work & Lineage."

